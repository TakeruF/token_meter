version: 2
updates:
  - package-ecosystem: swift
    directory: /TokenMeterCore
    schedule:
      interval: weekly
    groups:
      swift-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directories:
      - /Windows/src/TokenMeter.Windows.App
      - /Windows/src/TokenMeter.Windows.Core
      - /Windows/src/TokenMeter.Windows.Setup
      - /Windows/tests/TokenMeter.Windows.App.CompileCheck
      - /Windows/tests/TokenMeter.Windows.Core.Tests
      - /Windows/tests/TokenMeter.Windows.Setup.Tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
