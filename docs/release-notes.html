<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Token Meter</title>
  <link rel="stylesheet" href="styles.css?v=1.2.9">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Sparkle embeds this document in its update window. Keep it a document of
       the offered change, not a miniature version of the marketing site. */
    body { background: var(--paper); }
    .notes { max-width: 44rem; margin: 0 auto; padding: 1.5rem 1.5rem 2rem; }
    .notes h1 { font-size: 1.75rem; margin-bottom: 1.25rem; }
    .notes h2 { font-size: 1.1rem; margin: 1.5rem 0 .6rem; }
    .notes h3 { font-size: 1rem; margin: 1.2rem 0 .4rem; }
    .notes p, .notes li { font-size: .9375rem; line-height: 1.6; }
    .notes ul { margin: .5rem 0 1rem; padding-left: 1.25rem; }
    .notes code { padding: .1rem .25rem; border-radius: .25rem; background: var(--surface); }
    .language { display: flex; gap: .35rem; margin-top: 1.75rem; }
    .language button { border: 0; border-radius: .4rem; padding: .25rem .45rem; color: var(--muted); background: transparent; font: inherit; font-size: .75rem; cursor: pointer; }
    .language button[aria-pressed="true"] { color: var(--ink); background: var(--surface-2); }
    .error { color: var(--muted); }
  </style>
</head>
<body>
  <main class="notes" aria-live="polite">
    <article id="release-notes"><p class="error">Loading release notes…</p></article>
    <div class="language" role="group" aria-label="Language">
      <button type="button" data-lang="ja">日本語</button>
      <button type="button" data-lang="en">English</button>
      <button type="button" data-lang="zh-CN">中文</button>
      <button type="button" data-lang="ko">한국어</button>
    </div>
  </main>
  <script>
    const versions = [
      'v1.2.9', 'v1.2.8', 'v1.2.7', 'v1.2.6', 'v1.2.5', 'v1.2.4', 'v1.2.3', 'v1.2.2', 'v1.2.1', 'v1.2.0', 'v1.1.9', 'v1.1.8', 'v1.1.7', 'v1.1.6',
      'v1.1.5', 'v1.1.4', 'v1.1.3', 'v1.1.2', 'v1.1.1', 'v1.1.0', 'v1.0.1', 'v1.0.0'
    ];
    const requestedVersion = new URLSearchParams(window.location.search).get('version');
    const version = versions.includes(requestedVersion) ? requestedVersion : versions[0];
    const notes = document.getElementById('release-notes');
    const headings = { en: 'English', ja: '日本語', 'zh-CN': '中文', ko: '한국어' };
    let markdown = '';

    function sectionFor(language) {
      const wanted = headings[language] || headings.en;
      const lines = markdown.split(/\r?\n/);
      const title = lines.find(line => line.startsWith('# '));
      const selected = [];
      let inside = false;
      for (const line of lines) {
        if (line.startsWith('## ')) {
          inside = line.slice(3).trim() === wanted;
          continue;
        }
        if (!inside) continue;
        selected.push(line.startsWith('### ') ? `## ${line.slice(4)}` : line);
      }
      if (selected.join('').trim() || language === 'en') {
        return [title, ...selected].filter(Boolean).join('\n');
      }
      return sectionFor('en');
    }

    function render(language) {
      document.documentElement.lang = language;
      document.title = `Token Meter ${version}`;
      notes.innerHTML = marked.parse(sectionFor(language));
      document.querySelectorAll('[data-lang]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.lang === language));
      });
    }

    document.querySelectorAll('[data-lang]').forEach(button => {
      button.addEventListener('click', () => render(button.dataset.lang));
    });

    fetch(`releases/${version}.md`)
      .then(response => response.ok ? response.text() : Promise.reject())
      .then(text => { markdown = text; render('ja'); })
      .catch(() => { notes.innerHTML = '<p class="error">Release notes are unavailable.</p>'; });
  </script>
</body>
</html>
