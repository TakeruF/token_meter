<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0;url=https://takeruf.com/ja/projects/token-meter/releases">
  <link rel="canonical" href="https://takeruf.com/ja/projects/token-meter/releases">
  <title>Token Meter - Release notes</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           color: #17201e; background: #fcfdfb; font: 15px/1.7 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
    @media (prefers-color-scheme: dark) { body { color: #f2f4f1; background: #14171a; } }
    p { margin: 0; text-align: center; }
    a { color: #254ee8; }
    @media (prefers-color-scheme: dark) { a { color: #8aa5ff; } }
  </style>
  <script>
    (() => {
      const supported = new Set(['ja', 'en', 'zh', 'ko']);
      let saved;
      try { saved = localStorage.getItem('token-meter-language'); } catch {}
      const candidates = [saved, ...(navigator.languages || [navigator.language])];
      const locale = candidates.map(value => String(value || '').toLowerCase().split('-')[0])
        .find(value => supported.has(value)) || 'en';
      location.replace('https://takeruf.com/' + locale + '/projects/token-meter/releases' + location.search + location.hash);
    })();
  </script>
</head>
